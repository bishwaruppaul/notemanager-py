name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            platform: Windows
            ext: .exe
          - os: ubuntu-latest
            platform: Linux
            ext: ''
          - os: macos-latest
            platform: macOS
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python scripts/build.py

      - name: Rename for release
        shell: bash
        run: |
          if [ -f NoteManagerPy.exe ]; then
            mv NoteManagerPy.exe NoteManagerPy-${{ matrix.platform }}.exe
          elif [ -f NoteManagerPy ]; then
            mv NoteManagerPy NoteManagerPy-${{ matrix.platform }}
          elif [ -d NoteManagerPy.app ]; then
            mv NoteManagerPy.app NoteManagerPy-${{ matrix.platform }}.app
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteManagerPy-${{ matrix.platform }}
          path: |
            NoteManagerPy-${{ matrix.platform }}*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: NoteManagerPy-Windows

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: NoteManagerPy-Linux

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: NoteManagerPy-macOS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "=== Files to upload ==="
          ls -laR
          echo "=== Creating release ==="
          gh release create "$TAG" --title "$TAG" --notes "" 2>/dev/null || true
          echo "=== Uploading assets ==="
          gh release upload "$TAG" NoteManagerPy-*.* NoteManagerPy-* --clobber 2>&1 || \
          gh release upload "$TAG" ./* --clobber 2>&1
