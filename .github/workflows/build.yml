name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.2). Creates a GitHub Release with artifacts.'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            platform: Windows
            ext: .exe
          - os: ubuntu-latest
            platform: Linux
            ext: ''
          - os: macos-latest
            platform: macOS
            ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set version from tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.tag }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          echo "NM_VERSION=${raw#v}" >> $GITHUB_ENV
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

      - name: Prepare signing certificate (Windows only)
        if: runner.os == 'Windows'
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          PFX_PWD: ${{ secrets.SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:PFX_B64) { Write-Host "SIGNING_PFX_B64 not set, skipping"; exit 0 }
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_PFX=$pfxPath"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_PASSWORD=$env:PFX_PWD"

      - name: Build executable
        run: python scripts/build.py

      - name: Rename for release
        shell: bash
        run: |
          if [ -f NoteManagerPy.exe ]; then
            mv NoteManagerPy.exe NoteManagerPy-${{ matrix.platform }}.exe
          elif [ -f NoteManagerPy ]; then
            mv NoteManagerPy NoteManagerPy-${{ matrix.platform }}
          elif [ -d NoteManagerPy.app ]; then
            mv NoteManagerPy.app NoteManagerPy-${{ matrix.platform }}.app
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteManagerPy-${{ matrix.platform }}
          path: |
            NoteManagerPy-${{ matrix.platform }}*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag)

    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: NoteManagerPy-Windows

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: NoteManagerPy-Linux

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: NoteManagerPy-macOS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          echo "=== Files ==="
          ls -lh
          echo "=== Delete old release ==="
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "=== Create release ==="
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "" \
            NoteManagerPy-*
